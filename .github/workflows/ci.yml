name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Qualify installed release artifact
        run: |
          mkdir -p .qualification/consumer .qualification/runtime
          npm pack --pack-destination .qualification
          printf '%s\n' '{"private":true,"type":"module"}' > .qualification/consumer/package.json
          npm install --prefix .qualification/consumer --no-audit --no-fund "$PWD/.qualification/agent-sideband-$(node -p "require('./package.json').version").tgz"
          TMPDIR="$PWD/.qualification/runtime" node --import tsx scripts/qualify-scheduler.ts "$PWD/.qualification/consumer/node_modules/agent-sideband"
